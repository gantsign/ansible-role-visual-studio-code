# code: language=ansible
---
- name: Create keyrings dir (apt)
  become: true
  ansible.builtin.file:
    path: '/etc/apt/keyrings'
    state: directory
    mode: 'u=rwx,go=rx'

- include_tasks: 'apt-source-{{ visual_studio_code_use_deb822_format | ternary("deb822", "oneline" )}}.yml'

- name: Install VS Code (apt)
  become: true
  ansible.builtin.apt:
    name: "{{ visual_studio_code_package }}{{ (visual_studio_code_version | length > 0) | ternary('=' + visual_studio_code_version, '') }}"
    state: present
